<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SUNGET — لوحة تحكم الكافيه</title>
<link rel="stylesheet" href="assets/css/dashboard.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <header class="topbar">
      <button class="hamburger" id="hamburger"><i class="fas fa-bars"></i></button>
      <div class="hotel-switcher"><i class="fas fa-briefcase" style="color:var(--accent)"></i><select id="hotel-switcher-select"></select></div>
      <div class="search"><i class="fas fa-search" style="color:var(--muted)"></i><input placeholder="بحث..."></div>
      <div class="spacer"></div>
      <button class="icon-btn" id="theme-toggle" title="الوضع"><i class="fas fa-moon"></i></button>
      <div class="dropdown" id="notif-drop">
        <button class="icon-btn" id="bell"><i class="fas fa-bell"></i><span class="dot" id="notif-count" style="display:none;place-items:center;color:#111;font-size:10px;font-weight:800;width:16px;height:16px">0</span></button>
        <div class="dropdown-menu" id="notif-list"><div class="empty">لا إشعارات</div></div>
      </div>
      <div class="dropdown" id="profile-drop">
        <div class="profile"><div class="avatar" id="avatar">U</div><div><div style="font-weight:700;font-size:13px" id="current-biz-name">—</div><div style="font-size:11px;color:var(--muted)" id="profile-email"></div></div><i class="fas fa-chevron-down" style="color:var(--muted)"></i></div>
        <div class="dropdown-menu">
          <a class="item" href="my-businesses.html"><i class="fas fa-briefcase"></i> منشآتي</a>
          <div class="item" onclick="SUNGET.showPage('settings')"><i class="fas fa-cog"></i> الإعدادات</div>
          <div class="item" onclick="window.sb.auth.signOut().then(()=>location.href='signup.html')"><i class="fas fa-sign-out-alt"></i> تسجيل الخروج</div>
        </div>
      </div>
    </header>
    <section class="content" id="page-content"></section>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>window.SUNGET_CONFIG={SUPABASE_URL:window.SUPABASE_URL||'',SUPABASE_ANON_KEY:window.SUPABASE_ANON_KEY||''};</script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/modal.js"></script>
<script src="assets/js/dashboard.js"></script>
<script src="assets/js/bookings.js"></script>
<script src="assets/js/wallet.js"></script>
<script src="assets/js/messages.js"></script>
<script src="assets/js/offers.js"></script>
<script src="assets/js/coupons.js"></script>
<script src="assets/js/reviews.js"></script>
<script src="assets/js/settings.js"></script>
<script src="assets/js/charts.js"></script>
<script src="assets/js/notifications.js"></script>
<script>SUNGET.init('cafe');</script>
</body></html>
