<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SUNGET — تسجيل حساب</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <!-- ملف الأنماط الأصلي (يظل مربوطًا للحفاظ على أي ستايل حالي) -->
  <link rel="stylesheet" href="signup_styles.css" />
  <link rel="icon" href="favicon.png" />
  <style>
    /* =========================================================
       SUNGET — Modern Signup Styles (Override)
       ========================================================= */
    :root{
      --brand:#f5a524;
      --brand-2:#ef6c00;
      --brand-grad:linear-gradient(135deg,#f5a524 0%,#ef6c00 100%);
      --bg:#f6f7fb;
      --card:#ffffff;
      --text:#1c2230;
      --muted:#6b7280;
      --border:#e6e8ef;
      --input:#f9fafc;
      --shadow:0 20px 60px -20px rgba(30,41,59,.18), 0 8px 20px -12px rgba(30,41,59,.10);
      --radius:22px;
      --radius-sm:14px;
      --danger:#dc2626;
      --success:#16a34a;
    }
    @media (prefers-color-scheme: dark){
      :root{
        --bg:#0d1220;
        --card:#151b2c;
        --text:#eef1f7;
        --muted:#9aa3b7;
        --border:#242c44;
        --input:#1b2236;
        --shadow:0 24px 60px -24px rgba(0,0,0,.6), 0 8px 22px -12px rgba(0,0,0,.5);
      }
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      font-family:'Cairo',system-ui,sans-serif;
      background:
        radial-gradient(1200px 600px at 90% -10%, rgba(245,165,36,.18), transparent 60%),
        radial-gradient(900px 500px at -10% 110%, rgba(239,108,0,.15), transparent 60%),
        var(--bg);
      color:var(--text);
      min-height:100vh;
      display:flex;align-items:center;justify-content:center;
      padding:24px;
    }
    .frame{
      width:100%;max-width:1080px;
      background:var(--card);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      overflow:hidden;
      display:grid;grid-template-columns:1fr 1.2fr;
      border:1px solid var(--border);
      animation:pop .6s cubic-bezier(.22,.8,.28,1) both;
    }
    @keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
    .brand{
      padding:44px 34px;
      background:var(--brand-grad);
      color:#fff;
      display:flex;flex-direction:column;gap:16px;
      position:relative;overflow:hidden;
    }
    .brand::after{
      content:"";position:absolute;inset:auto -30% -40% auto;
      width:340px;height:340px;border-radius:50%;
      background:radial-gradient(circle,rgba(255,255,255,.25),transparent 60%);
    }
    .brand h3{margin:0;font-size:28px;font-weight:800;letter-spacing:.5px}
    .brand .lead{font-size:15px;opacity:.95;line-height:1.7}
    .brand .badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
    .brand .badges span{
      background:rgba(255,255,255,.18);backdrop-filter:blur(6px);
      padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600;
      border:1px solid rgba(255,255,255,.25);
    }
    .brand .foot{margin-top:auto;font-size:12px;opacity:.9}
    .content{padding:38px 34px}
    .tabs{
      display:flex;gap:10px;background:var(--input);
      padding:6px;border-radius:16px;margin-bottom:22px;
      border:1px solid var(--border);
    }
    .tab{
      flex:1;padding:12px 14px;border:0;background:transparent;
      color:var(--muted);font-weight:700;font-family:inherit;font-size:14px;
      border-radius:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;
      transition:all .25s ease;
    }
    .tab.active{background:var(--card);color:var(--text);box-shadow:0 4px 14px -6px rgba(0,0,0,.15)}
    .tab i{color:var(--brand)}
    h2{margin:0 0 18px;font-size:20px;font-weight:800}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .field{margin-bottom:14px;position:relative}
    .field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--muted)}
    .field .wrap{position:relative}
    .field .wrap i.lead-ic{
      position:absolute;top:50%;transform:translateY(-50%);inset-inline-start:14px;
      color:var(--muted);font-size:14px;pointer-events:none;
    }
    .field input, .field select{
      width:100%;padding:13px 42px 13px 42px;border-radius:var(--radius-sm);
      border:1px solid var(--border);background:var(--input);color:var(--text);
      font-family:inherit;font-size:14px;outline:none;transition:all .2s ease;
    }
    .field input:focus, .field select:focus{
      border-color:var(--brand);box-shadow:0 0 0 4px rgba(245,165,36,.15);background:var(--card);
    }
    .field input.valid{border-color:var(--success)}
    .field input.invalid{border-color:var(--danger)}
    .toggle-pass{
      position:absolute;top:50%;transform:translateY(-50%);inset-inline-end:12px;
      background:none;border:0;color:var(--muted);cursor:pointer;font-size:14px;padding:6px;
    }
    .hint{font-size:11px;color:var(--muted);margin-top:4px;min-height:14px}
    .hint.err{color:var(--danger)}
    .hint.ok{color:var(--success)}
    .strength{height:6px;border-radius:999px;background:var(--border);margin-top:8px;overflow:hidden}
    .strength > span{display:block;height:100%;width:0%;background:var(--danger);transition:all .3s ease;border-radius:999px}
    .btn{
      width:100%;padding:14px 18px;border:0;border-radius:var(--radius-sm);
      background:var(--brand-grad);color:#fff;font-weight:800;font-family:inherit;font-size:15px;
      cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;
      box-shadow:0 12px 28px -12px rgba(239,108,0,.55);
      transition:transform .2s ease, box-shadow .2s ease, opacity .2s ease;
    }
    .btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 18px 34px -14px rgba(239,108,0,.6)}
    .btn:disabled{opacity:.7;cursor:not-allowed}
    .btn .spinner{
      width:16px;height:16px;border-radius:50%;
      border:2px solid rgba(255,255,255,.4);border-top-color:#fff;
      animation:spin .8s linear infinite;display:none;
    }
    .btn.loading .spinner{display:inline-block}
    .btn.loading .lbl{opacity:.85}
    @keyframes spin{to{transform:rotate(360deg)}}
    .divider{display:flex;align-items:center;gap:12px;margin:18px 0;color:var(--muted);font-size:12px}
    .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--border)}
    .google-btn{
      width:100%;padding:12px 16px;border-radius:var(--radius-sm);
      border:1px solid var(--border);background:var(--card);color:var(--text);
      font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;
      display:flex;align-items:center;justify-content:center;gap:12px;
      transition:all .2s ease;
    }
    .google-btn:hover{border-color:var(--brand);transform:translateY(-1px);box-shadow:0 10px 22px -14px rgba(0,0,0,.25)}
    .msg{margin-top:14px;padding:12px 14px;border-radius:12px;font-size:13px;font-weight:600;display:none;align-items:center;gap:8px}
    .msg.show{display:flex;animation:pop .3s ease both}
    .msg.success{background:rgba(22,163,74,.12);color:var(--success);border:1px solid rgba(22,163,74,.3)}
    .msg.error{background:rgba(220,38,38,.10);color:var(--danger);border:1px solid rgba(220,38,38,.3)}
    .progress{height:3px;background:var(--border);border-radius:999px;margin-bottom:16px;overflow:hidden;display:none}
    .progress.show{display:block}
    .progress > span{display:block;height:100%;width:0%;background:var(--brand-grad);transition:width .4s ease}
    @media (max-width: 820px){
      .frame{grid-template-columns:1fr}
      .brand{padding:28px 24px}
      .content{padding:26px 22px}
      .row{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <div class="frame">
    <aside class="brand">
      <h3>SUNGET.COM</h3>
      <div class="lead">منصة سياحية متكاملة — احجز، أدر منشأتك، وواسّع نشاطك مع SUNGET.</div>
      <div class="badges">
        <span><i class="fa-solid fa-hotel"></i> فنادق</span>
        <span><i class="fa-solid fa-utensils"></i> مطاعم</span>
        <span><i class="fa-solid fa-mug-hot"></i> مقاهي</span>
        <span><i class="fa-solid fa-car"></i> تأجير سيارات</span>
        <span><i class="fa-solid fa-bus"></i> شركات رحلات</span>
      </div>
      <div class="foot">© 2025 — SUNGET</div>
    </aside>

    <main class="content">
      <div class="tabs" role="tablist">
        <button id="btn-user" class="tab active" type="button">
          <i class="fa-solid fa-user"></i> مستخدم
        </button>
        <button id="btn-provider" class="tab" type="button">
          <i class="fa-solid fa-building"></i> صاحب منشأة سياحية
        </button>
      </div>

      <div id="progress" class="progress"><span></span></div>

      <!-- ================= USER FORM ================= -->
      <section id="panel-user">
        <h2><i class="fa-solid fa-user-plus" style="color:var(--brand)"></i> تسجيل مستخدم</h2>
        <form id="form-user" novalidate>
          <div class="row">
            <div class="field">
              <label>الاسم الكامل</label>
              <div class="wrap">
                <i class="fa-solid fa-id-card lead-ic"></i>
                <input type="text" id="u_name" required autocomplete="name" />
              </div>
              <div class="hint" data-for="u_name"></div>
            </div>
            <div class="field">
              <label>رقم الهاتف</label>
              <div class="wrap">
                <i class="fa-solid fa-phone lead-ic"></i>
                <input type="tel" id="u_phone" required autocomplete="tel" />
              </div>
              <div class="hint" data-for="u_phone"></div>
            </div>
          </div>
          <div class="field">
            <label>البريد الإلكتروني</label>
            <div class="wrap">
              <i class="fa-solid fa-envelope lead-ic"></i>
              <input id="u_email" type="email" required autocomplete="email" />
            </div>
            <div class="hint" data-for="u_email"></div>
          </div>
          <div class="row">
            <div class="field">
              <label>كلمة المرور</label>
              <div class="wrap">
                <i class="fa-solid fa-lock lead-ic"></i>
                <input id="u_pass" type="password" minlength="6" required autocomplete="new-password" />
                <button class="toggle-pass" type="button" data-target="u_pass"><i class="fa-solid fa-eye"></i></button>
              </div>
              <div class="strength"><span id="u_strength"></span></div>
              <div class="hint" data-for="u_pass"></div>
            </div>
            <div class="field">
              <label>تأكيد كلمة المرور</label>
              <div class="wrap">
                <i class="fa-solid fa-lock lead-ic"></i>
                <input id="u_pass2" type="password" minlength="6" required autocomplete="new-password" />
                <button class="toggle-pass" type="button" data-target="u_pass2"><i class="fa-solid fa-eye"></i></button>
              </div>
              <div class="hint" data-for="u_pass2"></div>
            </div>
          </div>

          <button class="btn" type="submit">
            <span class="spinner"></span>
            <span class="lbl"><i class="fa-solid fa-user-check"></i> سجّل كمستخدم</span>
          </button>

          <div class="divider">أو</div>

          <button id="googleLogin" class="google-btn" type="button">
            <svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true">
              <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.8 1.1 7.9 3l5.7-5.7C34.3 6.1 29.4 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.3-.4-3.5z"/>
              <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 16 19 13 24 13c3 0 5.8 1.1 7.9 3l5.7-5.7C34.3 7.1 29.4 5 24 5 16.3 5 9.7 9.3 6.3 14.7z"/>
              <path fill="#4CAF50" d="M24 44c5.2 0 10-2 13.6-5.2l-6.3-5.2C29.2 35 26.7 36 24 36c-5.3 0-9.7-3.1-11.3-7.6l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
              <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4-4 5.3l6.3 5.2C41.4 35.4 44 30.1 44 24c0-1.3-.1-2.3-.4-3.5z"/>
            </svg>
            التسجيل بحساب Google
          </button>

          <div id="user-msg" class="msg"></div>
        </form>
      </section>

      <!-- ================= PROVIDER FORM ================= -->
      <section id="panel-provider" style="display:none">
        <h2><i class="fa-solid fa-building-user" style="color:var(--brand)"></i> تسجيل صاحب منشأة سياحية</h2>
        <form id="form-provider" novalidate>
          <div class="row">
            <div class="field">
              <label>اسم المنشأة</label>
              <div class="wrap">
                <i class="fa-solid fa-shop lead-ic"></i>
                <input type="text" id="p_business" required />
              </div>
              <div class="hint" data-for="p_business"></div>
            </div>
            <div class="field">
              <label>اسم المالك</label>
              <div class="wrap">
                <i class="fa-solid fa-user-tie lead-ic"></i>
                <input type="text" id="p_owner" required />
              </div>
              <div class="hint" data-for="p_owner"></div>
            </div>
          </div>

          <div class="row">
            <div class="field">
              <label>رقم الهاتف</label>
              <div class="wrap">
                <i class="fa-solid fa-phone lead-ic"></i>
                <input type="tel" id="p_phone" required />
              </div>
              <div class="hint" data-for="p_phone"></div>
            </div>
            <div class="field">
              <label>البريد الإلكتروني</label>
              <div class="wrap">
                <i class="fa-solid fa-envelope lead-ic"></i>
                <input id="p_email" type="email" required />
              </div>
              <div class="hint" data-for="p_email"></div>
            </div>
          </div>

          <div class="field">
            <label>نوع النشاط</label>
            <div class="wrap">
              <i class="fa-solid fa-briefcase lead-ic"></i>
              <select id="p_type" required>
                <option value="" disabled selected>-- اختر نوع النشاط --</option>
                <option value="hotel">🏨 فندق (Hotel)</option>
                <option value="restaurant">🍽 مطعم (Restaurant)</option>
                <option value="cafe">☕ مقهى (Cafe)</option>
                <option value="car">🚗 تأجير سيارات (Car Rental)</option>
                <option value="trip">🚌 شركة رحلات (Trip Company)</option>
              </select>
            </div>
            <div class="hint" data-for="p_type"></div>
          </div>

          <div class="row">
            <div class="field">
              <label>كلمة المرور</label>
              <div class="wrap">
                <i class="fa-solid fa-lock lead-ic"></i>
                <input id="p_pass" type="password" minlength="6" required autocomplete="new-password" />
                <button class="toggle-pass" type="button" data-target="p_pass"><i class="fa-solid fa-eye"></i></button>
              </div>
              <div class="strength"><span id="p_strength"></span></div>
              <div class="hint" data-for="p_pass"></div>
            </div>
            <div class="field">
              <label>تأكيد كلمة المرور</label>
              <div class="wrap">
                <i class="fa-solid fa-lock lead-ic"></i>
                <input id="p_pass2" type="password" minlength="6" required autocomplete="new-password" />
                <button class="toggle-pass" type="button" data-target="p_pass2"><i class="fa-solid fa-eye"></i></button>
              </div>
              <div class="hint" data-for="p_pass2"></div>
            </div>
          </div>

          <button class="btn" type="submit">
            <span class="spinner"></span>
            <span class="lbl"><i class="fa-solid fa-circle-check"></i> إنشاء حساب المنشأة</span>
          </button>

          <div id="provider-msg" class="msg"></div>
        </form>
      </section>
    </main>
  </div>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
  /* =========================================================
     SUNGET Signup Script
     - Preserves existing Supabase client / email verification
     - Two roles: user  |  provider (with business_type)
     ========================================================= */

  /* ---------- Supabase init (kept from previous version) ---------- */
  const SUPABASE_URL = "https://mqvmxqzwvpasdytbpbke.supabase.co";
  const SUPABASE_ANON_KEY =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1xdm14cXp3dnBhc2R5dGJwYmtlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjIyODMwMjksImV4cCI6MjA3Nzg1OTAyOX0.jHrxC0IcuWYkSaB2y-guc5tl5dPPWFSoasv3rmjcxuM";
  const sup = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  /* ---------- Routing map by business_type ---------- */
  const REGISTER_PAGES = {
    hotel:      "register-hotel.html",
    restaurant: "register-restaurant.html",
    cafe:       "cafe-dashboard (1).html",
    car:        "register-car.html",
    trip:       "register-trip.html",
  };
  const DASHBOARD_PAGES = {
    hotel:      "hotel-dashboard.html",
    restaurant: "restaurant-dashboard.html",
    cafe:       "cafe-dashboard.html",
    car:        "car-dashboard.html",
    trip:       "trip-dashboard.html",
  };

  /* ---------- Tab switching ---------- */
  const btnUser = document.getElementById("btn-user");
  const btnProv = document.getElementById("btn-provider");
  const panelUser = document.getElementById("panel-user");
  const panelProv = document.getElementById("panel-provider");
  function activate(which){
    const isUser = which === "user";
    panelUser.style.display = isUser ? "block" : "none";
    panelProv.style.display = isUser ? "none" : "block";
    btnUser.classList.toggle("active", isUser);
    btnProv.classList.toggle("active", !isUser);
  }
  btnUser.onclick = () => activate("user");
  btnProv.onclick = () => activate("provider");

  /* ---------- Message helper ---------- */
  function showMsg(el, txt, type = "success"){
    el.className = `msg show ${type}`;
    el.innerHTML = `<i class="fa-solid ${type === "success" ? "fa-circle-check" : "fa-circle-exclamation"}"></i> ${txt}`;
  }
  function clearMsg(el){ el.className = "msg"; el.innerHTML = ""; }

  /* ---------- Show/hide password ---------- */
  document.querySelectorAll(".toggle-pass").forEach(btn => {
    btn.addEventListener("click", () => {
      const inp = document.getElementById(btn.dataset.target);
      const icon = btn.querySelector("i");
      if (inp.type === "password"){ inp.type = "text"; icon.className = "fa-solid fa-eye-slash"; }
      else { inp.type = "password"; icon.className = "fa-solid fa-eye"; }
    });
  });

  /* ---------- Live validation ---------- */
  function setHint(input, text, kind){
    const h = document.querySelector(`.hint[data-for="${input.id}"]`);
    if (h){ h.textContent = text || ""; h.className = "hint " + (kind || ""); }
    input.classList.remove("valid","invalid");
    if (kind === "ok") input.classList.add("valid");
    else if (kind === "err") input.classList.add("invalid");
  }
  const emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  const phoneRe = /^[0-9+\-\s()]{6,}$/;

  function validateField(input){
    const v = input.value.trim();
    if (!v){ setHint(input, "هذا الحقل مطلوب", "err"); return false; }
    if (input.type === "email" && !emailRe.test(v)){ setHint(input, "بريد غير صالح", "err"); return false; }
    if (input.type === "tel" && !phoneRe.test(v)){ setHint(input, "رقم غير صالح", "err"); return false; }
    if (input.type === "password" && v.length < 6){ setHint(input, "6 أحرف على الأقل", "err"); return false; }
    setHint(input, "جيد", "ok"); return true;
  }
  document.querySelectorAll("input").forEach(inp => {
    inp.addEventListener("input", () => validateField(inp));
    inp.addEventListener("blur", () => validateField(inp));
  });

  /* ---------- Password strength meter ---------- */
  function strength(pw){
    let s = 0;
    if (pw.length >= 6) s++;
    if (pw.length >= 10) s++;
    if (/[A-Z]/.test(pw) && /[a-z]/.test(pw)) s++;
    if (/\d/.test(pw)) s++;
    if (/[^A-Za-z0-9]/.test(pw)) s++;
    return Math.min(s,4);
  }
  function bindStrength(inputId, barId){
    const inp = document.getElementById(inputId);
    const bar = document.getElementById(barId);
    inp.addEventListener("input", () => {
      const s = strength(inp.value);
      const colors = ["#dc2626","#f97316","#eab308","#84cc16","#16a34a"];
      const widths = [10,30,55,80,100];
      bar.style.width = widths[s] + "%";
      bar.style.background = colors[s];
    });
  }
  bindStrength("u_pass","u_strength");
  bindStrength("p_pass","p_strength");

  /* ---------- Confirm-password checks ---------- */
  function bindConfirm(passId, confirmId){
    const p = document.getElementById(passId);
    const c = document.getElementById(confirmId);
    const check = () => {
      if (!c.value) return;
      if (p.value !== c.value) setHint(c, "كلمتا المرور غير متطابقتين", "err");
      else setHint(c, "متطابقة", "ok");
    };
    c.addEventListener("input", check);
    p.addEventListener("input", check);
  }
  bindConfirm("u_pass","u_pass2");
  bindConfirm("p_pass","p_pass2");

  /* ---------- Progress bar ---------- */
  const progress = document.getElementById("progress");
  const progressBar = progress.querySelector("span");
  function setProgress(pct){
    progress.classList.toggle("show", pct > 0 && pct < 100);
    progressBar.style.width = pct + "%";
    if (pct >= 100) setTimeout(() => progress.classList.remove("show"), 400);
  }

  /* ---------- Button loading state ---------- */
  function setLoading(btn, on){
    btn.disabled = on;
    btn.classList.toggle("loading", on);
  }

  /* =========================================================
     USER SIGNUP
     ========================================================= */
  document.getElementById("form-user").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('button[type="submit"]');
    const msgEl = document.getElementById("user-msg");
    clearMsg(msgEl);

    const name  = document.getElementById("u_name").value.trim();
    const phone = document.getElementById("u_phone").value.trim();
    const email = document.getElementById("u_email").value.trim();
    const pass  = document.getElementById("u_pass").value;
    const pass2 = document.getElementById("u_pass2").value;

    if (!name || !phone || !email || !pass){
      return showMsg(msgEl, "يرجى تعبئة كل الحقول", "error");
    }
    if (!emailRe.test(email)) return showMsg(msgEl, "بريد إلكتروني غير صالح", "error");
    if (pass.length < 6)      return showMsg(msgEl, "كلمة المرور يجب أن تكون 6 أحرف على الأقل", "error");
    if (pass !== pass2)       return showMsg(msgEl, "كلمتا المرور غير متطابقتين", "error");

    setLoading(btn, true); setProgress(25);
    try {
      // check duplicate email in profiles
      const { data: existing } = await sup
        .from("profiles").select("email").eq("email", email).maybeSingle();
      if (existing){
        setLoading(btn, false); setProgress(0);
        return showMsg(msgEl, "هذا البريد مستخدم بالفعل", "error");
      }

      setProgress(55);
      // Supabase Auth signup (email verification kept as-is)
      const { data, error } = await sup.auth.signUp({
        email, password: pass,
        options: {
          data: { role: "user" },
          emailRedirectTo: window.location.origin + "/index.html"
        },
      });
      if (error) throw error;

      setProgress(80);
      // Insert profile row
      const { error: profileError } = await sup.from("profiles").insert([{
        auth_id: data.user.id, full_name: name, email, phone, role: "user"
      }]);
      if (profileError) throw profileError;

      setProgress(100);
      showMsg(msgEl, "تم إنشاء الحساب! تحقق من بريدك لتأكيد الحساب.", "success");
      setTimeout(() => window.location.href = "index.html", 1800);
    } catch (err){
      console.error(err);
      showMsg(msgEl, err.message || "حدث خطأ غير متوقع", "error");
      setProgress(0);
    } finally {
      setLoading(btn, false);
    }
  });

  /* =========================================================
     PROVIDER SIGNUP  (unified for all tourism businesses)
     ========================================================= */
  document.getElementById("form-provider").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('button[type="submit"]');
    const msgEl = document.getElementById("provider-msg");
    clearMsg(msgEl);

    const business_name = document.getElementById("p_business").value.trim();
    const owner_name    = document.getElementById("p_owner").value.trim();
    const phone         = document.getElementById("p_phone").value.trim();
    const email         = document.getElementById("p_email").value.trim();
    const business_type = document.getElementById("p_type").value;
    const pass          = document.getElementById("p_pass").value;
    const pass2         = document.getElementById("p_pass2").value;

    if (!business_name || !owner_name || !phone || !email || !business_type || !pass){
      return showMsg(msgEl, "يرجى تعبئة كل الحقول", "error");
    }
    if (!REGISTER_PAGES[business_type]) return showMsg(msgEl, "اختر نوع النشاط", "error");
    if (!emailRe.test(email)) return showMsg(msgEl, "بريد إلكتروني غير صالح", "error");
    if (pass.length < 6)      return showMsg(msgEl, "كلمة المرور يجب أن تكون 6 أحرف على الأقل", "error");
    if (pass !== pass2)       return showMsg(msgEl, "كلمتا المرور غير متطابقتين", "error");

    setLoading(btn, true); setProgress(25);
    try {
      // check duplicate email in providers
      const { data: existing } = await sup
        .from("providers").select("email").eq("email", email).maybeSingle();
      if (existing){
        setLoading(btn, false); setProgress(0);
        return showMsg(msgEl, "هذا البريد مستخدم بالفعل", "error");
      }

      setProgress(55);
      // Supabase Auth signup (email verification kept)
      const { data, error } = await sup.auth.signUp({
        email, password: pass,
        options: {
          data: { role: "provider", business_type },
          emailRedirectTo: window.location.origin + "/" + REGISTER_PAGES[business_type]
        },
      });
      if (error) throw error;

      setProgress(80);
      // Insert providers row (no hotel_name — unified schema)
      const { error: pErr } = await sup.from("providers").insert([{
        auth_id: data.user.id,
        business_name,
        business_type,
        owner_name,
        phone,
        email,
        status:  "pending",
        verified: false
      }]);
      if (pErr) throw pErr;

      setProgress(100);
      showMsg(msgEl,
        "تم إنشاء الحساب! تحقق من بريدك ثم أكمل بيانات نشاطك.",
        "success"
      );
      const next = REGISTER_PAGES[business_type] || "index.html";
      setTimeout(() => window.location.href = next, 2000);
    } catch (err){
      console.error(err);
      showMsg(msgEl, err.message || "حدث خطأ غير متوقع", "error");
      setProgress(0);
    } finally {
      setLoading(btn, false);
    }
  });

  /* =========================================================
     GOOGLE OAUTH (kept working)
     ========================================================= */
  document.getElementById("googleLogin").addEventListener("click", async (e) => {
    e.preventDefault();
    const { error } = await sup.auth.signInWithOAuth({
      provider: "google",
      options: { redirectTo: window.location.origin + "/index.html" }
    });
    if (error){ console.error(error); alert(error.message); }
  });

  /* =========================================================
     SESSION CHECK — route by business_type from providers
     (used when a signed-in user lands on this page)
     ========================================================= */
  async function routeSignedInUser(){
    const { data, error } = await sup.auth.getUser();
    if (error || !data.user) return;
    const user = data.user;
    const role = user.user_metadata?.role;

    if (role === "provider"){
      // read business_type from providers, not just metadata
      const { data: prov } = await sup
        .from("providers")
        .select("business_type, status")
        .eq("auth_id", user.id)
        .maybeSingle();

      const bt = prov?.business_type || user.user_metadata?.business_type;
      if (bt && DASHBOARD_PAGES[bt]){
        window.location.href = DASHBOARD_PAGES[bt];
        return;
      }
      // fallback: send to complete registration if we know type
      if (bt && REGISTER_PAGES[bt]){
        window.location.href = REGISTER_PAGES[bt];
        return;
      }
    }

    if (role === "user"){
      const sidebar = document.getElementById("clientSidebar");
      if (sidebar){ sidebar.style.display = "flex"; document.body.classList.add("sidebar-open"); }
      const loginBtn = document.querySelector(".login-btn");
      if (loginBtn) loginBtn.style.display = "none";
    }
  }
  routeSignedInUser();
  </script>
