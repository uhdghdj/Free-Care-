<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>احجز غرفتك – Sunget</title>
  <link rel="icon" href="favicon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
   /* ============================================================
       SUNGET — Booking Page
    ============================================================ */

    :root {
      --bg:        #0b0b0f;
      --bg-2:      #14141c;
      --surface:   #1a1a24;
      --surface-2: #20202c;
      --text:      #ffffff;
      --text-muted:#b8b8c4;
      --border:    rgba(255,255,255,0.08);
      --accent:    #ffb400;
      --accent-2:  #ff7a00;
      --danger:    #e63946;
      --success:   #27b82e;
      --shadow:    0 10px 30px rgba(0,0,0,0.45);
      --radius:    14px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ===== Hide default Google bar ===== */
.goog-te-banner-frame,
.skiptranslate { display: none !important; }
body { top: 0 !important; }
.goog-te-gadget { font-size: 0 !important; }
.goog-te-gadget .goog-te-combo { display: none; }
#google_translate_element { display: none; }

    body {
      font-family: "Cairo", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 30px 16px 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    /* ── BACK BUTTON ── */
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 20px;
      align-self: flex-start;
      transition: color .2s;
    }
    .back-btn:hover { color: var(--accent); }

    /* ── PAGE TITLE ── */
    h1 {
      font-weight: 800;
      text-align: center;
      font-size: clamp(24px, 4vw, 38px);
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 8px;
    }
    .subtitle {
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 28px;
    }

    /* ── BOOKING CONTAINER ── */
    .booking-container {
      width: 100%;
      max-width: 740px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: clamp(22px,4vw,36px);
    }

    /* ── HOTEL NAME BADGE ── */
    .hotel-badge {
      text-align: center;
      font-size: clamp(15px,2.2vw,18px);
      font-weight: 700;
      color: var(--accent);
      padding: 10px 20px;
      margin-bottom: 24px;
      background: var(--surface-2);
      border: 1px solid rgba(255,180,0,.2);
      border-radius: 30px;
      display: inline-block;
    }
    .hotel-badge-wrap { text-align: center; }

    /* ── FORM ── */
    form { display: flex; flex-direction: column; gap: 18px; }

    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

    label {
      font-weight: 700;
      color: var(--text);
      font-size: 13px;
      letter-spacing: .3px;
    }

    input, select, textarea {
      width: 100%;
      padding: 14px 16px;
      font-family: "Cairo", sans-serif;
      font-size: 14px;
      color: var(--text);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      outline: none;
      transition: border-color .3s, box-shadow .3s;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(255,180,0,.15);
    }
    select option { background: #1a1a24; color: var(--text); }

    /* ── ROOM INFO BOX ── */
    .room-info-box {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      display: none;
      gap: 8px;
      flex-direction: column;
    }
    .room-info-box.visible { display: flex; }
    .room-info-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
    }
    .room-info-row span.val { color: var(--text); }

    /* ── ROOM SLIDER ── */
    .room-slider-wrap {
      position: relative;
      width: 100%;
      overflow: hidden;
      border-radius: 12px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      display: none;
    }
    .room-slider-wrap.visible { display: block; }
    .room-slider-track {
      display: flex;
      transition: transform .4s ease;
    }
    .room-slider-track img {
      width: 100%;
      flex-shrink: 0;
      height: 220px;
      object-fit: cover;
    }
    .slider-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0,0,0,.55);
      color: #fff;
      border: none;
      font-size: 26px;
      padding: 6px 14px;
      cursor: pointer;
      z-index: 2;
      border-radius: 8px;
      line-height: 1;
      transition: background .2s;
    }
    .slider-nav:hover { background: rgba(255,180,0,.5); }
    .slider-nav.prev { left: 8px; }
    .slider-nav.next { right: 8px; }
    .slider-counter {
      position: absolute;
      bottom: 10px;
      right: 14px;
      background: rgba(0,0,0,.55);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 20px;
    }
    .no-photos {
      text-align: center;
      padding: 28px;
      color: var(--text-muted);
      font-size: 14px;
    }

    /* ── TOTAL PRICE ── */
    .total-price-box {
      text-align: center;
      font-size: clamp(18px,3vw,26px);
      font-weight: 800;
      padding: 18px;
      background: linear-gradient(135deg, rgba(255,180,0,.08), rgba(255,122,0,.08));
      border: 2px solid var(--accent);
      border-radius: var(--radius);
      color: var(--accent);
    }

    /* ── SUBMIT BUTTON ── */
    #confirmBooking {
      width: 100%;
      padding: 18px 24px;
      font-family: "Cairo", sans-serif;
      font-size: 16px;
      font-weight: 800;
      color: #000;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border: none;
      border-radius: 30px;
      cursor: pointer;
      letter-spacing: .5px;
      transition: all .3s ease;
    }
    #confirmBooking:hover { transform: translateY(-3px); box-shadow: 0 14px 32px rgba(255,180,0,.4); }
    #confirmBooking:disabled { opacity: .6; cursor: not-allowed; transform: none; }

    /* ── MESSAGES ── */
    .msg-box {
      padding: 14px 18px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      text-align: center;
      line-height: 1.6;
    }
    .msg-box.error   { background: rgba(230,57,70,.12);  border: 1px solid var(--danger);  color: var(--danger); }
    .msg-box.success { background: rgba(39,184,46,.12);  border: 1px solid var(--success); color: var(--success); }
    .msg-box.info    { background: rgba(255,180,0,.08);  border: 1px solid rgba(255,180,0,.3); color: var(--text-muted); }

    /* ── DIVIDER ── */
    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 4px 0;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 600px) {
      body { padding: 20px 12px 50px; }
      .booking-container { padding: 20px 14px; }
      .form-row { grid-template-columns: 1fr; }
    }

/* ── PAYMENT METHODS ── */
.payment-methods {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.payment-option {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 18px;
  background: var(--surface-2);
  border: 1.5px solid var(--border);
  border-radius: 12px;
  cursor: pointer;
  transition: border-color .25s, background .25s, box-shadow .25s;
  user-select: none;
}

.payment-option:hover {
  border-color: rgba(255,180,0,.45);
  background: rgba(255,180,0,.05);
}

.payment-option:has(input:checked) {
  border-color: var(--accent);
  background: rgba(255,180,0,.08);
  box-shadow: 0 0 0 3px rgba(255,180,0,.15);
}

.payment-option input[type=radio] {
  appearance: none;
  -webkit-appearance: none;
  width: 18px;
  height: 18px;
  border: 2px solid var(--text-muted);
  border-radius: 50%;
  flex-shrink: 0;
  transition: border-color .2s, background .2s;
  position: relative;
}

.payment-option input[type=radio]:checked {
  border-color: var(--accent);
  background: var(--accent);
  box-shadow: inset 0 0 0 4px var(--surface-2);
}

.payment-option .pay-logo {
  width: 36px;
  height: 36px;
  object-fit: contain;
  border-radius: 6px;
  background: #fff;
  padding: 4px;
  flex-shrink: 0;
}

.payment-option .pay-icon {
  font-size: 22px;
  flex-shrink: 0;
}

.payment-option .pay-label {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.payment-option .pay-label strong {
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
}

.payment-option .pay-label small {
  font-size: 12px;
  color: var(--text-muted);
  font-weight: 400;
}

  </style>
</head>

  <a class="back-btn" onclick="history.back(); return false;" href="#">
    ← العودة
  </a>

  <h1>احجز غرفتك الآن</h1>
  <p class="subtitle">أكمل بياناتك لتأكيد حجزك</p>

  <div class="booking-container">
    <div class="hotel-badge-wrap">
      <span class="hotel-badge" id="hotelName">جارٍ التحميل...</span>
    </div>

    <form id="bookingForm">

      <!-- ROOM SELECT -->
      <div class="form-group">
        <label><i class="fa-solid fa-door-open" style="color:var(--accent);margin-left:6px"></i>اختر الغرفة</label>
        <select id="roomSelect" required>
          <option value="">جارٍ تحميل الغرف...</option>
        </select>
      </div>

      <!-- ROOM PHOTO SLIDER -->
      <div class="room-slider-wrap" id="roomSliderWrap">
        <div class="room-slider-track" id="sliderTrack"></div>
        <button type="button" class="slider-nav prev" id="prevBtn">‹</button>
        <button type="button" class="slider-nav next" id="nextBtn">›</button>
        <div class="slider-counter" id="sliderCounter"></div>
        <div class="cover-badge" id="coverBadge" style="display:none">⭐ الصورة الرئيسية</div>
      </div>

      <!-- ROOM INFO PANEL -->
      <div class="room-info-panel" id="roomInfoPanel"></div>

      <hr class="divider" />

      <!-- DATES -->
      <div class="section-hdr"><i class="fa-solid fa-calendar-days"></i> تواريخ الإقامة</div>
      <div class="form-row">
        <div class="form-group">
          <label>تاريخ الوصول</label>
          <input type="date" id="checkIn" required />
        </div>
        <div class="form-group">
          <label>تاريخ المغادرة</label>
          <input type="date" id="checkOut" required />
        </div>
      </div>

      <hr class="divider" />

      <!-- GUEST INFO -->
      <div class="section-hdr"><i class="fa-solid fa-user"></i> بيانات الضيف</div>
      <div class="form-group">
        <label>رقم الهاتف</label>
        <input type="tel" id="guestPhone" placeholder="+201001234567" required />
      </div>

      <div class="form-group">
        <label>الدولة</label>
        <select id="guestCountry" required>
          <option value="">اختر الدولة...</option>
        </select>
      </div>

      <hr class="divider" />

      <!-- PAYMENT METHOD -->
      <div class="section-hdr"><i class="fa-solid fa-credit-card"></i> طريقة الدفع</div>
      <div class="payment-methods">
        <label class="payment-option">
          <input type="radio" name="payment_method" value="online">
          <span class="pay-icon">💳</span>
          <div class="pay-label">
            <strong>دفع إلكتروني</strong>
            <small>ادفع المبلغ كاملاً الآن بأمان</small>
          </div>
        </label>
        <label class="payment-option">
          <input type="radio" name="payment_method" value="hotel" checked>
          <span class="pay-icon">🏨</span>
          <div class="pay-label">
            <strong>الدفع في الفندق</strong>
            <small>أكّد حجزك الآن والدفع عند الوصول</small>
          </div>
        </label>
      </div>

      <!-- TOTAL PRICE -->
      <div class="total-price-box" id="totalPriceBox">
        <div id="totalPriceText">السعر الإجمالي: —</div>
        <small id="totalPriceSub"></small>
      </div>

      <!-- SUBMIT -->
      <button type="submit" id="confirmBooking">
        <i class="fa-solid fa-calendar-check"></i> تأكيد الحجز
      </button>

    </form>

    <div id="message" style="margin-top:14px"></div>
  </div>

      ["سلوفينيا","SI","🇸🇮"],["جزر سليمان","SB","🇸🇧"],["الصومال","SO","🇸🇴"],["جنوب أفريقيا","ZA","🇿🇦"],
      ["جنوب السودان","SS","🇸🇸"],["إسبانيا","ES","🇪🇸"],["سريلانكا","LK","🇱🇰"],["السودان","SD","🇸🇩"],
      ["سورينام","SR","🇸🇷"],["السويد","SE","🇸🇪"],["سويسرا","CH","🇨🇭"],["سوريا","SY","🇸🇾"],
      ["تايوان","TW","🇹🇼"],["طاجيكستان","TJ","🇹🇯"],["تنزانيا","TZ","🇹🇿"],["تايلاند","TH","🇹🇭"],
      ["تيمور الشرقية","TL","🇹🇱"],["توغو","TG","🇹🇬"],["تونغا","TO","🇹🇴"],["ترينيداد وتوباغو","TT","🇹🇹"],
      ["تونس","TN","🇹🇳"],["تركيا","TR","🇹🇷"],["تركمانستان","TM","🇹🇲"],["توفالو","TV","🇹🇻"],
      ["أوغندا","UG","🇺🇬"],["أوكرانيا","UA","🇺🇦"],["الإمارات","AE","🇦🇪"],["المملكة المتحدة","GB","🇬🇧"],
      ["الولايات المتحدة","US","🇺🇸"],["أوروغواي","UY","🇺🇾"],["أوزبكستان","UZ","🇺🇿"],["فانواتو","VU","🇻🇺"],
      ["الفاتيكان","VA","🇻🇦"],["فنزويلا","VE","🇻🇪"],["فيتنام","VN","🇻🇳"],["اليمن","YE","🇾🇪"],
      ["زامبيا","ZM","🇿🇲"],["زيمبابوي","ZW","🇿🇼"],["فلسطين","PS","🇵🇸"],["كوسوفو","XK","🇽🇰"],
    ];

    /* ============================================================
       GLOBALS
    ============================================================ */
    const params       = new URLSearchParams(window.location.search);
    const hotelId      = params.get("id");
    let hotelData      = null;
    let roomsArray     = [];           // includes room_photos, room_beds, room_features, room_bathroom_features
    let roomPrices     = {};
    let selectedRoom   = null;
    let bookedRanges   = [];
    let sliderIndex    = 0;
    let sliderImages   = [];
    let sliderPhotos   = [];           // full photo objects [{photo_url, is_cover}]

    /* ============================================================
       UTILITIES
    ============================================================ */
    function esc(s){ const d=document.createElement("div"); d.textContent=s||""; return d.innerHTML; }
    function showMessage(text, type = "info") {
      const el = document.getElementById("message");
      el.innerHTML = `<div class="msg-box ${type}">${text}</div>`;
      if (type !== "error") setTimeout(() => { el.innerHTML = ""; }, 5500);
    }

    /* ============================================================
       POPULATE COUNTRIES
    ============================================================ */
    function populateCountries() {
      const sel = document.getElementById("guestCountry");
      COUNTRIES.forEach(([name, code, flag]) => {
        const opt = document.createElement("option");
        opt.value = name;
        opt.textContent = `${flag} ${name}`;
        sel.appendChild(opt);
      });
    }

    /* ============================================================
       PHOTO SLIDER
    ============================================================ */
    function renderSlider(photos) {
      const wrap    = document.getElementById("roomSliderWrap");
      const track   = document.getElementById("sliderTrack");
      const counter = document.getElementById("sliderCounter");
      const badge   = document.getElementById("coverBadge");
      sliderPhotos  = photos;
      sliderImages  = photos.map(p => p.photo_url);
      sliderIndex   = 0;

      if (!photos.length) {
        wrap.classList.remove("visible");
        return;
      }

      track.innerHTML = photos.map(p =>
        `<img src="${esc(p.photo_url)}" alt="صورة الغرفة" loading="lazy" />`
      ).join("");

      wrap.classList.add("visible");
      updateSlider();
    }

    function updateSlider() {
      const n = sliderImages.length;
      document.getElementById("sliderTrack").style.transform = `translateX(-${sliderIndex * 100}%)`;
      document.getElementById("sliderCounter").textContent   = (sliderIndex + 1) + " / " + n;
      document.getElementById("coverBadge").style.display    = sliderPhotos[sliderIndex]?.is_cover ? "" : "none";
      document.getElementById("prevBtn").style.display = n > 1 ? "" : "none";
      document.getElementById("nextBtn").style.display = n > 1 ? "" : "none";
    }

    document.getElementById("prevBtn").onclick = () => {
      if (sliderIndex > 0) { sliderIndex--; updateSlider(); }
    };
    document.getElementById("nextBtn").onclick = () => {
      if (sliderIndex < sliderImages.length - 1) { sliderIndex++; updateSlider(); }
    };

    /* ============================================================
       ROOM INFO PANEL
    ============================================================ */
    const CURRENCY_LABELS = { USD:"$", EGP:"ج.م", SAR:"ر.س", AED:"د.إ", EUR:"€", GBP:"£" };

    function polPill(flag, trueLabel, falseLabel) {
      if (flag === true  || flag === 1)  return `<span class="rpol yes"><i class="fa-solid fa-check"></i> ${trueLabel}</span>`;
      if (flag === false || flag === 0)  return `<span class="rpol no"><i class="fa-solid fa-xmark"></i> ${falseLabel}</span>`;
      return "";
    }

    function renderRoomPanel(room) {
      const panel = document.getElementById("roomInfoPanel");
      if (!room) { panel.classList.remove("visible"); panel.innerHTML = ""; return; }

      const cur    = CURRENCY_LABELS[room.currency] || room.currency || "";
      const price  = room.price ? `<span class="rip-price">${Number(room.price).toLocaleString("ar")} ${esc(cur)} <small>/ ليلة</small></span>` : "";

      // Beds
      const beds   = (room.room_beds || []);
      const bedsHtml = beds.length
        ? `<div><div class="rip-section-label"><i class="fa-solid fa-bed" style="color:var(--accent)"></i> الأسرّة</div>
            <div class="rip-chips">${beds.map(b=>`<span class="rip-chip bed"><i class="fa-solid fa-bed"></i> ${esc(b.quantity||1)}× ${esc(b.bed_type||"")}</span>`).join("")}</div></div>`
        : "";

      // Features
      const feats  = (room.room_features || []).map(f=>f.feature).filter(Boolean);
      const bFeats = (room.room_bathroom_features || []).map(f=>f.feature).filter(Boolean);
      const featsHtml = feats.length
        ? `<div><div class="rip-section-label"><i class="fa-solid fa-star" style="color:var(--accent)"></i> مرافق الغرفة</div>
            <div class="rip-chips">${feats.map(f=>`<span class="rip-chip">${esc(f)}</span>`).join("")}</div></div>`
        : "";
      const bFeatsHtml = bFeats.length
        ? `<div><div class="rip-section-label"><i class="fa-solid fa-shower" style="color:var(--accent)"></i> مرافق الحمام</div>
            <div class="rip-chips">${bFeats.map(f=>`<span class="rip-chip">${esc(f)}</span>`).join("")}</div></div>`
        : "";

      // Specs
      let specs = "";
      if (room.max_adults)     specs += `<span class="rip-spec"><i class="fa-solid fa-user"></i>${room.max_adults} بالغ</span>`;
      if (room.max_children)   specs += `<span class="rip-spec"><i class="fa-solid fa-child"></i>${room.max_children} طفل</span>`;
      if (room.size_sqm)       specs += `<span class="rip-spec"><i class="fa-solid fa-vector-square"></i>${room.size_sqm} م²</span>`;
      if (room.available_rooms)specs += `<span class="rip-spec"><i class="fa-solid fa-door-open"></i>${room.available_rooms} غرفة متاحة</span>`;
      if (room.min_stay > 1)   specs += `<span class="rip-spec"><i class="fa-solid fa-calendar-days"></i>أدنى ${room.min_stay} ليالٍ</span>`;
      if (room.max_stay)       specs += `<span class="rip-spec"><i class="fa-solid fa-calendar-check"></i>أقصى ${room.max_stay} ليلة</span>`;

      // Policies
      let pols = "";
      pols += polPill(room.breakfast_included, "إفطار مشمول", "إفطار غير مشمول");
      pols += polPill(room.refundable, "قابل للاسترداد", "غير قابل للاسترداد");
      pols += polPill(room.children_allowed, "يسمح بالأطفال", "لا يسمح بالأطفال");
      if (room.smoking_allowed === true)
        pols += `<span class="rpol neu"><i class="fa-solid fa-smoking"></i> التدخين مسموح</span>`;
      if (room.crib_available)
        pols += `<span class="rpol yes"><i class="fa-solid fa-baby"></i> سرير أطفال</span>`;
      if (room.extra_bed_available)
        pols += `<span class="rpol neu"><i class="fa-solid fa-bed"></i> سرير إضافي</span>`;
      if (room.pay_at_arrival)
        pols += `<span class="rpol neu"><i class="fa-solid fa-money-bill"></i> دفع عند الوصول</span>`;

      panel.innerHTML = `
        <div class="rip-title">
          <div>
            <div class="rip-name">${esc(room.name || "غرفة")}</div>
            ${room.room_type ? `<div class="rip-type"><i class="fa-solid fa-tag"></i> ${esc(room.room_type)}</div>` : ""}
          </div>
          ${price}
        </div>
        ${specs ? `<div class="rip-specs">${specs}</div>` : ""}
        ${bedsHtml}
        ${featsHtml}
        ${bFeatsHtml}
        ${pols ? `<div><div class="rip-section-label"><i class="fa-solid fa-shield-halved" style="color:var(--accent)"></i> السياسات</div><div class="rip-pols">${pols}</div></div>` : ""}
        ${room.description ? `<div class="rip-desc">${esc(room.description)}</div>` : ""}
      `;
      panel.classList.add("visible");
    }

    /* ============================================================
       PRICE CALCULATION
    ============================================================ */
    const CURRENCY_AR = { USD:"دولار", EGP:"جنيه", SAR:"ريال سعودي", AED:"درهم", EUR:"يورو", GBP:"جنيه إسترليني" };

    function calculateTotal() {
      const checkIn  = document.getElementById("checkIn").value;
      const checkOut = document.getElementById("checkOut").value;
      const txtEl    = document.getElementById("totalPriceText");
      const subEl    = document.getElementById("totalPriceSub");

      if (!checkIn || !checkOut || !selectedRoom) {
        txtEl.textContent = "السعر الإجمالي: —";
        subEl.textContent = "";
        return 0;
      }

      const start  = new Date(checkIn  + "T00:00:00");
      const end    = new Date(checkOut + "T00:00:00");
      const nights = Math.ceil((end - start) / 86400000);

      if (nights <= 0) {
        txtEl.textContent = "السعر الإجمالي: —";
        subEl.textContent = "";
        return 0;
      }

      const price   = Number(selectedRoom.price || 0);
      const total   = price * nights;
      const cur     = CURRENCY_LABELS[selectedRoom.currency] || selectedRoom.currency || "";
      const curAr   = CURRENCY_AR[selectedRoom.currency]     || selectedRoom.currency || "";

      txtEl.textContent = `${total.toLocaleString("ar")} ${cur} إجمالاً`;
      subEl.textContent = `${nights} ليلة × ${price.toLocaleString("ar")} ${cur} / ليلة`;
      return total;
    }

    /* ============================================================
       BOOKED DATES (conflict check)
    ============================================================ */
    async function loadBookedDates(roomId) {
      bookedRanges = [];
      if (!roomId) return;
      try {
        const { data } = await sb.from("bookings")
          .select("check_in,check_out")
          .eq("room_id", roomId)
          .neq("status", "cancelled");
        (data || []).forEach(b => {
          bookedRanges.push({ start: new Date(b.check_in), end: new Date(b.check_out) });
        });
      } catch(err){ console.error("loadBookedDates:", err); }
    }

    function isRangeBooked(s, e) {
      return bookedRanges.some(r => s < r.end && e > r.start);
    }

    function validateDates() {
      const ci = document.getElementById("checkIn").value;
      const co = document.getElementById("checkOut").value;
      if (!ci || !co) return true;
      const start = new Date(ci), end = new Date(co);
      if (end <= start) {
        showMessage("❌ تاريخ المغادرة يجب أن يكون بعد تاريخ الوصول", "error");
        document.getElementById("checkOut").value = "";
        return false;
      }
      if (isRangeBooked(start, end)) {
        showMessage("❌ هذه الفترة محجوزة بالفعل، اختر تواريخ أخرى", "error");
        document.getElementById("checkIn").value  = "";
        document.getElementById("checkOut").value = "";
        return false;
      }
      return true;
    }

    /* ============================================================
       CONFLICT CHECK BEFORE INSERT
    ============================================================ */
    async function checkConflict(roomId, ci, co) {
      const { data } = await sb.from("bookings")
        .select("id").eq("room_id", roomId).neq("status","cancelled")
        .lt("check_in", co).gt("check_out", ci);
      return data?.length > 0;
    }

    /* ============================================================
       LOAD HOTEL + ROOMS (with photos / beds / features)
    ============================================================ */
    async function loadHotel() {
      if (!hotelId) { showMessage("❌ لم يتم تحديد الفندق", "error"); return; }
      showMessage("جارٍ تحميل بيانات الفندق...", "info");

      try {
        /* Hotel */
        const { data: hotel, error: hotelErr } = await sb
          .from("hotels").select("id, hotel_name, payment_method").eq("id", hotelId).single();
        if (hotelErr || !hotel) { showMessage("❌ الفندق غير موجود", "error"); return; }
        hotelData = hotel;
        document.title = "حجز – " + hotel.hotel_name + " | Sunget";
        document.getElementById("hotelName").textContent = hotel.hotel_name;

        /* Rooms with all related data in one query */
        const { data: rooms2, error: rErr2 } = await sb.from("rooms")
          .select(`
            *,
            room_photos (id, photo_url, is_cover, position),
            room_beds (bed_type, quantity),
            room_features (feature),
            room_bathroom_features (feature)
          `)
          .eq("hotel_id", hotelId)
          .order("created_at", { ascending: true });

        if (rErr2 || !rooms2?.length) {
          showMessage("❌ لا توجد غرف متاحة لهذا الفندق حالياً", "error");
          return;
        }

        roomsArray = rooms2;
        const roomSelect = document.getElementById("roomSelect");
        roomSelect.innerHTML = '<option value="">— اختر غرفة —</option>';
        roomPrices = {};

        rooms2.forEach(room => {
          const price    = Number(room.price || 0);
          const cur      = CURRENCY_LABELS[room.currency] || room.currency || "";
          const avail    = room.available_rooms != null ? ` · ${room.available_rooms} متاحة` : "";
          const priceStr = price ? ` — ${price.toLocaleString("ar")} ${cur}/ليلة` : "";
          const opt = document.createElement("option");
          opt.value       = room.id;
          opt.textContent = `${room.name || room.room_type || "غرفة"}${priceStr}${avail}`;
          roomPrices[room.id] = price;
          roomSelect.appendChild(opt);
        });

        /* Pre-select room from URL ?room=... */
        const urlRoom = params.get("room");
        if (urlRoom && roomsArray.find(r => r.id === urlRoom)) {
          roomSelect.value = urlRoom;
          roomSelect.dispatchEvent(new Event("change"));
        }

        /* Pre-fill dates */
        const ci = params.get("ci"), co = params.get("co");
        if (ci) document.getElementById("checkIn").value  = ci;
        if (co) document.getElementById("checkOut").value = co;
        if (ci || co) calculateTotal();

        showMessage(`✅ تم تحميل ${rooms2.length} غرفة بنجاح`, "success");

      } catch(err) {
        console.error("loadHotel:", err);
        showMessage("❌ حدث خطأ في تحميل الصفحة", "error");
      }
    }

    /* ============================================================
       ROOM SELECT CHANGE
    ============================================================ */
    document.getElementById("roomSelect").addEventListener("change", async function () {
      const rid = this.value || null;
      selectedRoom = rid ? roomsArray.find(r => r.id === rid) || null : null;

      if (!selectedRoom) {
        renderSlider([]);
        renderRoomPanel(null);
        calculateTotal();
        return;
      }

      /* Sort photos: cover first, then position */
      const photos = [...(selectedRoom.room_photos || [])].sort((a,b) => {
        if (!!b.is_cover - !!a.is_cover !== 0) return !!b.is_cover - !!a.is_cover;
        return (a.position ?? 0) - (b.position ?? 0);
      });

      renderSlider(photos);
      renderRoomPanel(selectedRoom);

      await loadBookedDates(rid);
      calculateTotal();
      validateDates();
    });

    document.getElementById("checkIn").addEventListener("change",  () => { calculateTotal(); validateDates(); });
    document.getElementById("checkOut").addEventListener("change", () => { calculateTotal(); validateDates(); });

    /* ============================================================
       SUBMIT
    ============================================================ */
    document.getElementById("bookingForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const checkIn      = document.getElementById("checkIn").value;
      const checkOut     = document.getElementById("checkOut").value;
      const guestPhone   = document.getElementById("guestPhone").value.trim();
      const guestCountry = document.getElementById("guestCountry").value;
      const payEl        = document.querySelector('input[name="payment_method"]:checked');
      const payMethod    = payEl?.value;

      if (!selectedRoom)   { showMessage("❌ اختر غرفة من القائمة", "error"); return; }
      if (!checkIn || !checkOut) { showMessage("❌ اختر تواريخ الوصول والمغادرة", "error"); return; }
      if (!guestPhone)     { showMessage("❌ أدخل رقم الهاتف", "error"); return; }
      if (!guestCountry)   { showMessage("❌ اختر الدولة", "error"); return; }
      if (!payMethod)      { showMessage("❌ اختر طريقة الدفع", "error"); return; }
      if (!validateDates()) return;

      const total = calculateTotal();
      if (total <= 0) { showMessage("❌ تحقق من التواريخ والسعر", "error"); return; }

      const btn = document.getElementById("confirmBooking");
      btn.disabled    = true;
      btn.innerHTML   = '<i class="fa-solid fa-spinner fa-spin"></i> جارٍ تأكيد الحجز...';

      try {
        /* Auth check */
        const { data: userData, error: authErr } = await sb.auth.getUser();
        if (authErr || !userData?.user) {
          showMessage("❌ يجب تسجيل الدخول أولاً للحجز", "error");
          btn.disabled = false;
          btn.innerHTML = '<i class="fa-solid fa-calendar-check"></i> تأكيد الحجز';
          return;
        }

        /* Conflict check */
        const hasConflict = await checkConflict(selectedRoom.id, checkIn, checkOut);
        if (hasConflict) {
          showMessage("❌ الغرفة محجوزة في هذه الفترة، اختر تواريخ أخرى", "error");
          await loadBookedDates(selectedRoom.id);
          btn.disabled = false;
          btn.innerHTML = '<i class="fa-solid fa-calendar-check"></i> تأكيد الحجز';
          return;
        }

        /* Insert booking */
        const { data: booking, error: bookingErr } = await sb.from("bookings").insert([{
          user_id:        userData.user.id,
          hotel_id:       hotelId,
          room_id:        selectedRoom.id,
          check_in:       checkIn,
          check_out:      checkOut,
          guest_phone:    guestPhone,
          guest_country:  guestCountry,
          status:         "pending",
          total_price:    total,
          payment_method: payMethod,
        }]).select().single();

        if (bookingErr || !booking) {
          console.error("Booking insert error:", bookingErr);
          showMessage("❌ حدث خطأ في إنشاء الحجز، حاول مجدداً", "error");
          btn.disabled = false;
          btn.innerHTML = '<i class="fa-solid fa-calendar-check"></i> تأكيد الحجز';
          return;
        }

        /* Save to localStorage for potential redirect */
        const cur = CURRENCY_LABELS[selectedRoom.currency] || selectedRoom.currency || "";
        localStorage.setItem("bookingData", JSON.stringify({
          bookingId:    booking.id,
          hotel_name:   hotelData.hotel_name,
          hotelId,
          roomId:       selectedRoom.id,
          roomName:     selectedRoom.name || selectedRoom.room_type || "غرفة",
          checkIn,
          checkOut,
          total,
          currency:     cur,
          payMethod,
        }));

        if (payMethod === "online") {
          /* ELECTRONIC — redirect to payment gateway */
          showMessage("✅ تم إنشاء الحجز! جارٍ التحويل للدفع الإلكتروني...", "success");
          setTimeout(() => { window.location.href = "paymob.html"; }, 2000);
        } else {
          /* AT HOTEL — confirm immediately, NO charge */
          showMessage(
            `✅ تم تأكيد حجزك بنجاح!<br>
             <strong>${hotelData.hotel_name}</strong> · ${selectedRoom.name || "الغرفة"}<br>
             الوصول: ${checkIn} — المغادرة: ${checkOut}<br>
             💰 الدفع عند الوصول — لا يوجد أي رسوم الآن`,
            "success"
          );
          btn.innerHTML = '<i class="fa-solid fa-circle-check"></i> تم الحجز بنجاح';
          /* Optionally redirect to a confirmation page */
          setTimeout(() => {
            window.location.href = `hotel.html?id=${hotelId}`;
          }, 4000);
        }

      } catch(err) {
        console.error("booking error:", err);
        showMessage("❌ حدث خطأ غير متوقع، حاول مجدداً", "error");
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-calendar-check"></i> تأكيد الحجز';
      }
    });

    /* ============================================================
       INIT
    ============================================================ */
    document.addEventListener("DOMContentLoaded", () => {
      const today = new Date().toISOString().split("T")[0];
      document.getElementById("checkIn").min  = today;
      document.getElementById("checkOut").min = today;
      populateCountries();
      loadHotel();
    });
  </script>
